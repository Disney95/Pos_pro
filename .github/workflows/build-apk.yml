name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (requerido por Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Agregar plataforma Android (si no existe)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generar íconos de la app a partir de resources/
        run: npx @capacitor/assets generate --android

      - name: Sincronizar proyecto web con Android
        run: npx cap sync android

      - name: Agregar plugin nativo InstallTime (fecha real de instalación del sistema)
        run: |
          python3 - <<'PYEOF'
          import re, os

          # Ubicar el paquete de la app a partir de capacitor.config.json
          import json
          with open("capacitor.config.json", "r", encoding="utf-8") as f:
              app_id = json.load(f)["appId"]
          pkg_path = app_id.replace(".", "/")
          java_dir = f"android/app/src/main/java/{pkg_path}"
          os.makedirs(java_dir, exist_ok=True)

          plugin_path = f"{java_dir}/InstallTimePlugin.kt"
          plugin_code = f'''package {app_id}

          import com.getcapacitor.JSObject
          import com.getcapacitor.Plugin
          import com.getcapacitor.PluginCall
          import com.getcapacitor.PluginMethod
          import com.getcapacitor.annotation.CapacitorPlugin

          @CapacitorPlugin(name = "InstallTime")
          class InstallTimePlugin : Plugin() {{
              @PluginMethod
              fun getInstallTime(call: PluginCall) {{
                  try {{
                      val pm = context.packageManager
                      val info = pm.getPackageInfo(context.packageName, 0)
                      val ret = JSObject()
                      ret.put("firstInstallTime", info.firstInstallTime)
                      call.resolve(ret)
                  }} catch (e: Exception) {{
                      call.reject("No se pudo leer firstInstallTime: " + e.message)
                  }}
              }}
          }}
          '''
          with open(plugin_path, "w", encoding="utf-8") as f:
              f.write(plugin_code)
          print(f"Plugin creado en {plugin_path}")

          # Registrar el plugin en MainActivity (Kotlin o Java, según lo genere Capacitor)
          main_kt = f"{java_dir}/MainActivity.kt"
          main_java = f"{java_dir}/MainActivity.java"

          if os.path.exists(main_kt):
              with open(main_kt, "r", encoding="utf-8") as f:
                  content = f.read()
              if "registerPlugin(InstallTimePlugin" not in content:
                  if "import android.os.Bundle" not in content:
                      content = content.replace(
                          "import com.getcapacitor.BridgeActivity",
                          "import android.os.Bundle\nimport com.getcapacitor.BridgeActivity"
                      )
                  content = re.sub(
                      r"class MainActivity\s*:\s*BridgeActivity\(\)\s*\{",
                      "class MainActivity : BridgeActivity() {\n"
                      "    override fun onCreate(savedInstanceState: Bundle?) {\n"
                      "        registerPlugin(InstallTimePlugin::class.java)\n"
                      "        super.onCreate(savedInstanceState)\n"
                      "    }",
                      content
                  )
                  with open(main_kt, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Plugin registrado en MainActivity.kt")
              else:
                  print("El plugin ya estaba registrado en MainActivity.kt")
          elif os.path.exists(main_java):
              with open(main_java, "r", encoding="utf-8") as f:
                  content = f.read()
              if "registerPlugin(InstallTimePlugin" not in content:
                  if "import android.os.Bundle;" not in content:
                      content = content.replace(
                          "import com.getcapacitor.BridgeActivity;",
                          "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;"
                      )
                  content = re.sub(
                      r"public class MainActivity\s+extends\s+BridgeActivity\s*\{",
                      "public class MainActivity extends BridgeActivity {\n"
                      "    @Override\n"
                      "    public void onCreate(Bundle savedInstanceState) {\n"
                      "        registerPlugin(InstallTimePlugin.class);\n"
                      "        super.onCreate(savedInstanceState);\n"
                      "    }",
                      content
                  )
                  with open(main_java, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Plugin registrado en MainActivity.java")
              else:
                  print("El plugin ya estaba registrado en MainActivity.java")
          else:
              raise SystemExit("No se encontró MainActivity ni en Kotlin ni en Java")
          PYEOF

      - name: Establecer versionCode y versionName de Android
        run: |
          python3 - <<'PYEOF'
          import re, json, os

          with open("package.json", "r", encoding="utf-8") as f:
              version_name = json.load(f)["version"]

          run_number = os.environ["GITHUB_RUN_NUMBER"]

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', content)
          new_content = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version_name}"', new_content)

          if new_content == content:
              raise SystemExit(
                  "No se encontraron versionCode/versionName en build.gradle para reemplazar. "
                  "Revisa manualmente android/app/build.gradle."
              )

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"versionCode={run_number}  versionName={version_name}")
          PYEOF

      - name: Agregar permisos de Bluetooth al AndroidManifest.xml
        run: |
          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "BLUETOOTH_SCAN" not in content:
              permissions = (
                  '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n'
              )
              idx = content.find(">", content.find("<manifest")) + 1
              content = content[:idx] + "\n" + permissions + content[idx:]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Permisos de Bluetooth agregados al manifiesto")
          else:
              print("Los permisos ya estaban presentes")
          PYEOF

      - name: Agregar permiso de Cámara al AndroidManifest.xml (necesario para escanear códigos con la cámara)
        run: |
          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "android.permission.CAMERA" not in content:
              permissions = (
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                  '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n'
              )
              idx = content.find(">", content.find("<manifest")) + 1
              content = content[:idx] + "\n" + permissions + content[idx:]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Permiso de Cámara agregado al manifiesto")
          else:
              print("El permiso de Cámara ya estaba presente")
          PYEOF

      - name: Poner la barra de estado y la barra de navegación de Android en blanco
        run: |
          python3 - <<'PYEOF'
          path = "android/app/src/main/res/values/styles.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "windowLightNavigationBar" not in content:
              idx_style = content.find('<style name="AppTheme"')
              idx_close = content.find("</style>", idx_style)
              items = (
                  '\n        <item name="android:statusBarColor">@android:color/white</item>\n'
                  '        <item name="android:navigationBarColor">@android:color/white</item>\n'
                  '        <item name="android:windowLightStatusBar">true</item>\n'
                  '        <item name="android:windowLightNavigationBar">true</item>\n    '
              )
              content = content[:idx_close] + items + content[idx_close:]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Colores de barra de estado/navegación puestos en blanco")
          else:
              print("Ya estaban configurados")
          PYEOF

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de depuración (para pruebas rápidas)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK de depuración como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: pos-pro-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decodificar la llave de firma
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Compilar APK de release firmado (instalable directamente, misma firma siempre)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Subir APK de release firmado como artefacto descargable
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pos-pro-apk-firmado
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Compilar AAB firmado (para Google Play)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Subir AAB firmado como artefacto descargable
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pos-pro-aab-firmado
          path: android/app/build/outputs/bundle/release/app-release.aab
